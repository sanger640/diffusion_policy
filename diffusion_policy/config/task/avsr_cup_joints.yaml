name: avsr_cup_joints

# Joint-space action: policy predicts the next 8 joint configurations directly.
# No rotation representation needed — IK is handled by the arm driver.
# action = joint_pos(6 rad) + gripper(1) = 7D
# obs    = joint_pos(6 rad) + gripper(1) = 7D  (same source, direct mapping)
image_shape: [3, 240, 320]
action_dim: 7          # joint_pos(6) + gripper(1)
agent_pos_dim: 7       # joint_pos(6) + gripper(1)

dataset_path: "${hydra:runtime.cwd}/data/avsr_teleop_data"

shape_meta: &shape_meta
  obs:
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    agent_pos:
      shape:
        - ${task.agent_pos_dim}
      type: low_dim
  action:
    shape:
      - ${task.action_dim}

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner
  n_train: 0
  n_test: 0

dataset:
  _target_: diffusion_policy.dataset.avsr_dataset.AvSRDataset
  dataset_path: ${task.dataset_path}
  shape_meta: *shape_meta
  action_mode: joints

  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}

  seed: 42
  val_ratio: 0.05
  max_train_episodes: null
